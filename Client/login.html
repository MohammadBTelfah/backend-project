<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../Client/css/login.css">
</head>
<body>
    <!-- Updated: Added split screen layout for laptop view -->
    <div class="container-fluid p-0">
        <div class="row g-0">
            <!-- Added: Left side banner for laptop view -->
            <div class="col-lg-6 d-none d-lg-block banner-side">
                <div class="h-100 d-flex flex-column justify-content-center align-items-center text-white p-5">
                    <h1 class="display-4 fw-bold mb-4">Welcome to Our Store</h1>
                    <p class="lead text-center">Discover amazing products and deals</p>
                    <img src="https://images.unsplash.com/photo-1491933382434-500287f9b54b" alt="Laptop" class="img-fluid rounded-4 mt-4" style="max-width: 80%;">
                </div>
            </div>
            <!-- Updated: Right side login form -->
            <div class="col-12 col-lg-6">
                <div class="min-vh-100 d-flex align-items-center justify-content-center p-4">
                    <div class="card shadow-lg" style="max-width: 500px; width: 100%;">
                        <div class="card-body p-4 p-md-5">
                            <div class="text-center mb-4">
                                <img src="https://images.unsplash.com/photo-1534802046520-4f27db7f3ae5?ixlib=rb-4.0.3" alt="Logo" class="logo mb-4" width="80">
                                <h2 class="fw-bold">Welcome Back</h2>
                                <p class="text-muted">Please login to your account</p>
                            </div>
                            <form id="loginForm" class="needs-validation" novalidate>
                                <div class="form-floating mb-3">
                                    <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
                                    <label for="email">Email address</label>
                                    <div class="invalid-feedback">Please enter a valid email address</div>
                                </div>
                                <div class="form-floating mb-3 position-relative">
                                    <input type="password" class="form-control" id="password" placeholder="Password" required minlength="8">
                                    <label for="password">Password</label>
                                    <i class="bi bi-eye-slash position-absolute end-0 top-50 translate-middle-y me-3 password-toggle" role="button"></i>
                                    <div class="invalid-feedback">Password must be at least 8 characters</div>
                                </div>
                                <div class="d-flex justify-content-between mb-4">
                                    <div class="form-check">
                                        <input type="checkbox" class="form-check-input" id="remember">
                                        <label class="form-check-label" for="remember">Remember me</label>
                                    </div>
                                    <a href="#" class="text-decoration-none">Forgot password?</a>
                                </div>
                                <button type="submit" class="btn btn-primary w-100 mb-4 py-3">Sign In</button>
                                <div class="separator text-muted text-center mb-4">OR</div>
                                <div class="social-login">
                                    <button type="button" class="btn btn-outline-dark w-100 mb-3">
                                        <i class="bi bi-google me-2"></i>Continue with Google
                                    </button>
                                    <button type="button" class="btn btn-outline-primary w-100 mb-3">
                                        <i class="bi bi-facebook me-2"></i>Continue with Facebook
                                    </button>
                                    <button type="button" class="btn btn-outline-dark w-100">
                                        <i class="bi bi-apple me-2"></i>Continue with Apple
                                    </button>
                                    <a href="register.html" class="d-block text-center mt-4 text-muted">Don't have an account? Sign Up</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../Client/js/login.js"></script>
</body>
</html>
