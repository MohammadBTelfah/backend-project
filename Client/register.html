<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/register.css">
</head>
<body>
    <div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
        <div class="card registration-card shadow-lg">
            <div class="card-body p-4 p-md-5">
                <h2 class="text-center mb-4">Create Account</h2>
                <form id="registerForm" class="needs-validation" novalidate>
                    <div class="form-floating mb-3">
                        <input type="text" class="form-control" id="fullName" placeholder="Enter full name" required minlength="2">
                        <label for="fullName">Full Name</label>
                        <div class="invalid-feedback">Please enter your full name (minimum 2 characters)</div>
                    </div>
                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="remail" placeholder="Enter email address" required>
                        <label for="remail">Email Address</label>
                        <div class="invalid-feedback">Please enter a valid email address</div>
                    </div>
                    <div class="form-floating mb-3 password-field">
                        <input type="password" class="form-control" id="Rpassword" placeholder="Enter password" required pattern="^(?=.*[A-Z])(?=.*[0-9])(?=.*[!@#$%^&*])[a-zA-Z0-9!@#$%^&*]{8,}$">
                        <label for="Rpassword">Password</label>
                        <i class="bi bi-eye-slash password-toggle"></i>
                        <div class="password-strength mt-2"></div>
                        <div class="invalid-feedback">Password must be at least 8 characters with uppercase, number, and special character</div>
                    </div>
                    <div class="form-floating mb-3 password-field">
                        <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm password" required>
                        <label for="confirmPassword">Confirm Password</label>
                        <div class="invalid-feedback">Passwords do not match</div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mb-3">Create Account</button>
                    <div class="text-center mb-3">
                        <span class="divider-text">or continue with</span>
                    </div>
                    <div class="d-flex gap-2 mb-4">
                        <button type="button" class="btn btn-outline-secondary flex-grow-1">
                            <i class="bi bi-google me-2"></i>Google
                        </button>
                        <button type="button" class="btn btn-outline-secondary flex-grow-1">
                            <i class="bi bi-facebook me-2"></i>Facebook
                        </button>
                    </div>
                    <div class="text-center">
                        <p class="mb-0">Already have an account? <a href="login.html" class="text-decoration-none">Sign in</a></p>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/register.js"></script>
</body>
</html>
